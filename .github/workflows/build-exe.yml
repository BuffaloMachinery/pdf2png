name: Publish Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify release EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/PDF2PNG_Converter.exe")) {
            throw "dist/PDF2PNG_Converter.exe was not found."
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF2PNG_Converter
          path: dist/PDF2PNG_Converter.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PDF2PNG_Converter.exe
          body: |
            # PDF2PNG Converter

            Download `PDF2PNG_Converter.exe` from the Assets section below and run it on Windows.
