name: Build Windows EXE

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies without Poppler
      shell: cmd
      run: |
        python -m pip install --upgrade pip wheel
        pip install PySimpleGUI==4.60.5.1 Pillow==10.1.0 pyinstaller
    
    - name: Build EXE (minimal build)
      shell: cmd
      run: pyinstaller --onefile --windowed --name "PDF2PNG轉換器" main.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: PDF2PNG-EXE
        path: dist/PDF2PNG轉換器.exe
        if-no-files-found: error
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/PDF2PNG轉換器.exe
        body: |
          # ⚠️ 重要提示

          此 Release 版本的 EXE 可能不完整。
          
          ## 📥 獲取完整功能的 EXE
          
          **推薦方法：在 Windows 上本地構建**
          
          1. 下載源代碼
          2. 執行 `BUILD_EXE.bat`
          3. 完全支持 PDF 轉換
          
          查看 [GET_EXE_QUICK.md](https://github.com/BuffaloMachinery/pdf2png/blob/main/GET_EXE_QUICK.md) 獲取詳細說明。
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
